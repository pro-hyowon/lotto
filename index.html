    const parsed=parseLottoQR(qr);
    if(parsed){applyScan(parsed.round,parsed.games,'QR코드','qr');return;}

    setScan('scanning','숫자 읽는 중... (처음 한 번은 10~20초 걸려요)');
    let ocr=null;
    try{ocr=await readOCR(img);}catch(e){
      setScan('error','인터넷 연결이 필요해요. 연결 후 다시 시도하거나 번호를 직접 입력해주세요.');return;
    }
    if(ocr&&ocr.games.length){applyScan(ocr.round,ocr.games,'숫자 인식',ocr.roundSource);return;}
    setScan('error','번호를 읽지 못했어요. 용지를 평평하게 펴고 QR코드가 잘 보이게 다시 찍거나, 아래에 직접 입력해주세요.');
  }finally{
    scanBusy=false;
    const btn=document.getElementById('scan-btn');
    if(btn){btn.disabled=false;btn.textContent='🔍 번호 읽고 당첨 확인';}
  }
}

function applyScan(round,games,method,src){
  checkState.tickets=games.map(n=>({nums:[...n]}));
  if(round){checkState.round=round;checkState.roundSource=src||null;}
  else{checkState.round=null;checkState.roundSource=null;} // 못 읽으면 최신 회차 기준 + 경고
  checkResultShown=true;
  const tip=method==='숫자 인식'?' · 사진과 번호가 맞는지 확인하세요':'';
  scanStatus={state:round?'done':'error',msg:round
    ?`✓ ${method}로 ${games.length}게임 인식 · 제${round}회`+tip
    :`${games.length}게임 번호는 읽었지만 회차를 못 읽었어요. 아래 회차를 확인해주세요`+tip};
  saveCheckState();
  renderCheck();refreshAllTickets();
  setTimeout(()=>{const el=document.getElementById('check-result');if(el)el.scrollIntoView({behavior:'smooth',block:'start'});},150);
}

// === Service Worker 등록 (안드로이드 PWA 설치 활성화) ===
// data: URL로 최소 SW 등록 - file:// 환경에서는 무시됨 (오류 없음)
if('serviceWorker' in navigator && location.protocol!=='file:'){
  const swCode=`
    self.addEventListener('install',e=>self.skipWaiting());
    self.addEventListener('activate',e=>self.clients.claim());
    self.addEventListener('fetch',e=>{});
  `;
  const blob=new Blob([swCode],{type:'application/javascript'});
  const swUrl=URL.createObjectURL(blob);
  navigator.serviceWorker.register(swUrl).catch(()=>{});
}

// beforeinstallprompt 이벤트 (안드로이드 Chrome의 설치 프롬프트 캡처)
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',(e)=>{
  e.preventDefault();
  deferredPrompt=e;
  // 설치 버튼을 install-banner에 활성화
  const banner=document.getElementById('install-banner');
  if(banner){
    banner.innerHTML=`
      📱 <b>탭해서 앱 설치하기</b><br>
      <span style="font-size:11px;opacity:.9">홈 화면에 앱으로 추가됩니다 (바로가기 아님)</span>
    `;
    banner.classList.add('show');
    banner.onclick=async()=>{
      if(!deferredPrompt) return;
      deferredPrompt.prompt();
      const{outcome}=await deferredPrompt.userChoice;
      if(outcome==='accepted'){
        banner.classList.remove('show');
        localStorage.setItem('install-banner-dismissed','1');
      }
      deferredPrompt=null;
    };
  }
});

// === 초기화 ===
function init(){
  // === 저장된 사용자 추가 회차 복원 ===
  const saved=loadUserData();
  if(saved.length>0){
    saved.forEach(d=>{
      if(!allData.find(x=>x.round===d.round)){
        allData.push(d);
      }
    });
    allData.sort((a,b)=>a.round-b.round);
  }

  loadCheckState();

  appStats=buildStats(allData);
  recs=generateRecs(appStats);
  magicRecs=generateMagicRecs(appStats).sort((a,b)=>b.score-a.score);
  renderLatest();
  renderRecommend();
  renderMagic();
  renderCheck();refreshAllTickets();
  renderStats();
  renderNumbers();
  renderHistory();

  // 저장된 회차 알림 (처음 로드 시 표시)
  if(saved.length>0){
    setTimeout(()=>{
      const bar=document.getElementById('restore-notice');
      if(bar){
        bar.textContent=`💾 저장된 ${saved.length}개 회차 복원됨 (${saved.map(d=>d.round).join(', ')}회)`;
        bar.classList.add('show');
        setTimeout(()=>bar.classList.remove('show'),4000);
      }
    },300);
  }

  // PWA 설치 안내
  const isStandalone=window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone;
  const dismissed=localStorage.getItem('install-banner-dismissed');
  if(!isStandalone&&!dismissed){
    setTimeout(()=>{
      const banner=document.getElementById('install-banner');
      if(banner){
        banner.classList.add('show');
        banner.onclick=()=>{banner.classList.remove('show');localStorage.setItem('install-banner-dismissed','1');};
      }
    },800);
  }
}
init();
</script>
